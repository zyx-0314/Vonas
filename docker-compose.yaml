version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: youtube-analytics-postgres
    environment:
      POSTGRES_DB: youtube_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - youtube-analytics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youtube_analytics"]
      interval: 30s
      timeout: 10s
      retries: 5

  # YouTube Analytics MVP Application
  youtube-analytics-mvp:
    build:
      context: ./youtube-analytics-mvp
      dockerfile: Dockerfile
    container_name: youtube-analytics-app
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres:5432/youtube_analytics
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3002
    volumes:
      - ./youtube-analytics-mvp:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - youtube-analytics-network
    develop:
      watch:
        - action: sync
          path: ./youtube-analytics-mvp/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./youtube-analytics-mvp/public
          target: /app/public
        - action: sync
          path: ./youtube-analytics-mvp/prisma
          target: /app/prisma
        - action: rebuild
          path: ./youtube-analytics-mvp/package.json
        - action: rebuild
          path: ./youtube-analytics-mvp/package-lock.json
        - action: rebuild
          path: ./youtube-analytics-mvp/next.config.js
        - action: rebuild
          path: ./youtube-analytics-mvp/tailwind.config.js

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: youtube-analytics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - youtube-analytics-network
    depends_on:
      - youtube-analytics-mvp

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: youtube-analytics-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - youtube-analytics-network
    depends_on:
      - prometheus

  # Node Exporter for System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: youtube-analytics-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - youtube-analytics-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  youtube-analytics-network:
    driver: bridge